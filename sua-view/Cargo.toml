[package]
name = "sua-view"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Fast local comic archive reader engine"
license = "MIT"

[lib]
name = "sua_view_core"
crate-type = ["staticlib", "rlib", "cdylib"]

[[bin]]
name = "sua-view-engine"
path = "src/main.rs"

[[bin]]
name = "sua-view-build"
path = "src/bin/build-app.rs"

[dependencies]
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
