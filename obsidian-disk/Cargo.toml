[package]
name = "obsidian-disk"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Minimal Rust disk benchmark inspired by CrystalDiskMark"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
lto = "thin"
strip = true
