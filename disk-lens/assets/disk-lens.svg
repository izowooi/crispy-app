<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>DiskLens</title>
  <desc>디스크이자 용량 고리. 찬 만큼 밝게 빛난다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1FA7A0"/>
      <stop offset="0.55" stop-color="#0F5568"/>
      <stop offset="1" stop-color="#07222F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#B8FFE9" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#B8FFE9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fill" gradientUnits="userSpaceOnUse" x1="640" y1="300" x2="330" y2="640">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#7CF0D0"/>
    </linearGradient>
  </defs>

  <!-- 바탕 -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="103" y="103" width="818" height="818" rx="183" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="6"/>

  <!-- 디스크 전체 -->
  <circle cx="512" cy="512" r="218" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="92"/>

  <!-- 사용 중인 용량 -->
  <path d="M512.0 294.0 A218 218 0 1 1 331.3 633.9" fill="none" stroke="#04161F" stroke-opacity="0.3" stroke-width="92" stroke-linecap="round" transform="translate(0 12)"/>
  <path d="M512.0 294.0 A218 218 0 1 1 331.3 633.9" fill="none" stroke="url(#fill)" stroke-width="92" stroke-linecap="round"/>

  <!-- 디스크의 중심 -->
  <circle cx="512" cy="512" r="54" fill="#FFFFFF"/>
</svg>
